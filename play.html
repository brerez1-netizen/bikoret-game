<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📱 שלט קבוצה - מסלול המכשולים הבירוקרטי</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="js/gameData.js?v=1"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap');
    :root { --blue: #2563eb; --gold: #ffc233; --bg: #140d08; --card: #2b1a10; --green: #2a9d3f; --ink: #0a0602; }
    html, body { margin: 0; background-color: var(--bg); background-image: repeating-conic-gradient(from 0deg at 50% 10%, #2a1608 0deg 9deg, #140d08 9deg 18deg); color: #fdf3e0; font-family: 'Rubik', system-ui, sans-serif; text-align: center; padding: 20px; touch-action: manipulation; box-sizing: border-box; }
    h1, h2, h3 { font-weight: 900; }
    .card { background: var(--card); padding: 25px; border-radius: 20px; border: 3px solid var(--ink); margin-bottom: 20px; }
    .btn { background: var(--blue); color: white; border: 3px solid var(--ink); padding: 25px; border-radius: 16px; font-size: 1.8rem; font-weight: 900; width: 100%; margin-top: 15px; box-shadow: 0 6px 0 var(--ink); }
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .opt-btn { background: var(--card); color: white; border: 4px solid var(--gold); padding: 65px 10px; border-radius: 24px; font-size: 4.5rem; font-weight: 900; box-shadow: 0 8px 0 var(--ink); }
    .char-item { padding: 8px; border: 3px solid transparent; border-radius: 15px; cursor: pointer; background: rgba(255,255,255,0.04); }
    .char-item img { width: 64px; height: 92px; object-fit: contain; display: block; }
    .selected { border-color: var(--gold); background: rgba(255,194,51,0.15); }
  </style>
</head>
<body>

<div id="setupView">
  <h2 style="font-size: 2rem; color: var(--gold);">🚧 הצטרפות למסלול המכשולים</h2>
  <div class="card">
    <input type="text" id="pName" placeholder="שם הקבוצה" style="width:100%; padding:20px; border-radius:15px; font-size:1.6rem; border:2px solid var(--ink); margin-bottom:20px; box-sizing:border-box;">
    <div id="charList" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:35px;"></div>
    <button class="btn" style="background:var(--green); box-shadow: 0 6px 0 #14532d;" onclick="join()">🚀 היכנס ללובי</button>
  </div>
</div>

<div id="gameView" style="display:none;">
  <h1 id="myName" style="font-size: 2rem; margin: 0;">...</h1>
  <div id="status-msg" style="color:var(--gold); font-weight:bold; margin: 25px 0; font-size: 1.8rem;"></div>

  <button id="rollBtn" class="btn" style="display:none; background:var(--green); box-shadow: 0 6px 0 #14532d;" onclick="roll()">🎲 הטל קובייה</button>

  <div id="quizArea" style="display: none;"><div class="opt-grid">
      <button class="opt-btn" onclick="sendAns(0)">א</button>
      <button class="opt-btn" onclick="sendAns(1)">ב</button>
      <button class="opt-btn" onclick="sendAns(2)">ג</button>
      <button class="opt-btn" onclick="sendAns(3)">ד</button>
  </div></div>

  <div id="wheelArea" style="display: none;">
    <button class="btn" style="background:var(--gold); color:var(--ink); box-shadow: 0 6px 0 #a16207; padding: 60px 10px; font-size: 2.5rem;" onclick="spin()">🎡 סובב גלגל!</button>
  </div>
</div>

<script>
  const config = { apiKey: "AIzaSyCgGQQXcDmQw9vbtVXN5F0sQxgDas71Fbc", databaseURL: "https://erez-bikoret-game-default-rtdb.firebaseio.com", projectId: "erez-bikoret-game" };
  firebase.initializeApp(config);
  const db = firebase.database();
  let myId = localStorage.getItem('game_id') || ("p_" + Date.now());
  let selectedIcon = "moreh-m";
  let currentGame = { turn: 0, turnOrder: [] };
  let currentPlayers = {};

  function charImg(icon, w, h) {
    return `<img src="images/characters/${icon}.png" style="width:${w}px;height:${h}px;object-fit:contain;vertical-align:middle;">`;
  }

  function initChars() {
    if(!window.gameData) return setTimeout(initChars, 400);
    const list = document.getElementById('charList'); list.innerHTML = '';
    window.gameData.characters.forEach((c, idx) => {
      const el = document.createElement('div'); el.className = 'char-item' + (idx === 0 ? ' selected' : '');
      el.innerHTML = `<img src="images/characters/${c.icon}.png" alt="${c.name}">`;
      el.onclick = () => { document.querySelectorAll('.char-item').forEach(i=>i.classList.remove('selected')); el.classList.add('selected'); selectedIcon = c.icon; };
      list.appendChild(el);
    });
  }

  function join() {
    const name = document.getElementById('pName').value; if(!name) return alert("נא להזין שם קבוצה");
    db.ref('players/' + myId).set({ name, icon: selectedIcon, color: '#2563eb', pos: -1, score: 0 });
    localStorage.setItem('game_id', myId); showGame();
  }

  function showGame() {
    document.getElementById('setupView').style.display = 'none'; document.getElementById('gameView').style.display = 'block';
    db.ref('game').on('value', snap => { currentGame = snap.val() || { turn: 0, turnOrder: [] }; render(); });
    db.ref('players').on('value', snap => { currentPlayers = snap.val() || {}; render(); });
  }

  function render() {
    const g = currentGame; const ps = currentPlayers; const me = ps[myId]; if(!me) return;
    const isMyTurn = g.turnOrder && g.turnOrder[g.turn] === myId;
    const finished = me.pos >= 49;
    document.getElementById('myName').innerHTML = charImg(me.icon,36,36) + " " + me.name + " (" + (me.score || 0) + ")";
    document.getElementById('status-msg').innerText = finished ? "סיימת את המסלול! 🏁 ממתינים לשאר הקבוצות..." : (isMyTurn ? "תורך הגיע! 🌟" : "המתן...");
    const data = window.gameData.cells[g.activeCell];
    document.getElementById('rollBtn').style.display = (isMyTurn && !finished && !g.activeCell) ? 'block' : 'none';
    document.getElementById('quizArea').style.display = (isMyTurn && data?.type === 'quiz' && (g.selection === null || g.selection === undefined)) ? 'block' : 'none';
    document.getElementById('wheelArea').style.display = (isMyTurn && data?.type === 'wheel' && !g.wheelResult) ? 'block' : 'none';
  }

  function roll() {
    if((currentPlayers[myId]?.pos ?? -1) >= 49) return;
    const r = Math.floor(Math.random()*6)+1;
    db.ref('game').update({ state: 'moving', lastRoll: r, selection: null, wheelResult: null });
    db.ref('players/'+myId).once('value', s => {
      const currentPos = s.val().pos;
      const newPos = Math.min((currentPos < 0 ? -1 : currentPos) + r, 49);
      db.ref('players/'+myId).update({ pos: newPos });
      db.ref('game').update({ state: 'playing', activeCell: newPos + 1 });
    });
  }

  async function sendAns(idx) {
    const gSnap = await db.ref('game').once('value'); const g = gSnap.val();
    const data = window.gameData.cells[g.activeCell]; const pSnap = await db.ref('players/' + myId).once('value'); const p = pSnap.val();
    const elapsed = g.startTime ? (Date.now() - g.startTime) / 1000 : 0;
    let bonus = (idx === data.correct) ? Math.max(50, 100 - Math.round(elapsed*3)) : 0;
    const move = (idx === data.correct) ? (data.correctMove || 0) : (data.wrongMove || 0);
    await db.ref('players/' + myId).update({ score: (p.score || 0) + bonus, pos: Math.max(0, Math.min(p.pos + move, 49)) });
    db.ref('game').update({ selection: idx });
  }

  function spin() {
    const rot = 1440 + Math.floor(Math.random() * 360);
    db.ref('game').update({ state: 'wheeling', wheelRotation: rot });
    setTimeout(() => {
      db.ref('game').once('value', gSnap => {
        const cell = window.gameData.cells[gSnap.val().activeCell];
        const normalized = rot % 360;
        let resIndex = (normalized < 120) ? 0 : (normalized < 240 ? 1 : 2);
        const res = cell.outcomes[resIndex];
        db.ref('game').update({ state: 'playing', wheelResult: "תוצאה: " + res.text });
        db.ref('players/'+myId).once('value', s => { db.ref('players/'+myId).update({ pos: Math.max(0, Math.min(s.val().pos + res.move, 49)) }); });
      });
    }, 3100);
  }

  initChars(); db.ref('players/' + myId).once('value', s => { if(s.exists()) showGame(); });
</script>
</body>
</html>
